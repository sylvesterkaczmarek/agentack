name: Release

on:
  push:
    branches:
      - "release/v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate release ref and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED="release/v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]]; then
            echo "Release branch ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release commit is not contained in main." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build and validate distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          rm -rf build dist
          python -m build
          python -m twine check dist/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentack/
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-pypi:
    name: Verify public PyPI install
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install released package from PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .pypi-venv
          for attempt in {1..12}; do
            if .pypi-venv/bin/python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --index-url https://pypi.org/simple/ \
              "agentack==${VERSION}"; then
              break
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "agentack ${VERSION} was not installable from PyPI." >&2
              exit 1
            fi
            sleep 10
          done
          test "$(.pypi-venv/bin/agentack --version)" = "agentack ${VERSION}"
          .pypi-venv/bin/agentack demo
          .pypi-venv/bin/agentack coverage

  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "AgentAck ${RELEASE_TAG}" \
            --generate-notes \
            --latest
