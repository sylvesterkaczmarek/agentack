name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Smoke
        run: |
          agentack demo secure
          set +e
          agentack demo action-swap
          fail_code=$?
          agentack demo secure --write /tmp/agentack-secure.jsonl
          head -n -1 /tmp/agentack-secure.jsonl > /tmp/agentack-incomplete.jsonl
          agentack check /tmp/agentack-incomplete.jsonl
          incomplete_code=$?
          set -e
          test "$fail_code" -eq 1
          test "$incomplete_code" -eq 3
