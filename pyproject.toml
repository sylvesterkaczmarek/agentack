[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentack"
version = "0.2.0"
description = "Test whether human approval controls for AI agents actually work."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
keywords = ["ai-agents", "ai-security", "human-in-the-loop", "agentic-security", "approval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/agentack"
Repository = "https://github.com/sylvesterkaczmarek/agentack"
Issues = "https://github.com/sylvesterkaczmarek/agentack/issues"

[project.scripts]
agentack = "agentack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
