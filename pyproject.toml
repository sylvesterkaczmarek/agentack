[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentack"
version = "0.4.0"
description = "Test whether human approval controls for AI agents actually work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
keywords = ["ai-agents", "ai-security", "human-in-the-loop", "agentic-security", "approval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/agentack"
Repository = "https://github.com/sylvesterkaczmarek/agentack"
Issues = "https://github.com/sylvesterkaczmarek/agentack/issues"

[project.scripts]
agentack = "agentack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
